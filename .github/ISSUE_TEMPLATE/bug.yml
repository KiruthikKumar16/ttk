name: Bug report
description: Report a reproducible defect
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Include no passwords, tokens, private student data, or GST documents.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Numbered steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, device, and deployment environment
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Attach screenshots with student and payment details removed.
